<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#FFEFB3">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | LinkUp</title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Leckerli+One&display=swap">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main class="auth login-page">

        <aside class="auth-aside">
            <a href="../index.html" class="logo">Link<em>Up</em></a>
            <div class="auth-aside-body">
                <p class="eyebrow" data-reveal>Account recovery</p>
                <h1 class="h1" data-reveal>Reset your <em>password.</em></h1>
                <p data-reveal>Enter the email you signed up with and we'll send you a link to choose a new password.</p>
            </div>
            <p class="auth-foot">Brands × Events × Opportunities</p>
        </aside>

        <section class="auth-main">
            <div class="auth-panel auth-panel--narrow">

                <div class="auth-heading" data-reveal>
                    <h2 class="h2">Forgot password</h2>
                    <p>We'll email you a recovery link.</p>
                </div>

                <form class="form login-form" id="forgotForm" data-reveal>

                    <div class="field login-form-group">
                        <label for="forgotEmail">Email address</label>
                        <input type="email" id="forgotEmail" placeholder="you@example.com" autocomplete="email" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block login-submit">Send recovery link →</button>

                    <p id="forgotMessage" class="form-message login-message" role="status" aria-live="polite"></p>

                </form>

                <p class="auth-switch signup-text">
                    Remembered it? <a href="login.html">Back to sign in</a>
                </p>

            </div>
        </section>
    </main>

<script src="../js/script.js"></script>

    <!-- SUPABASE SDK (must load before the shared config) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2" integrity="sha384-WgXwGL6fUsYJWNaKJgVbrJKGRQwc1vieh2oy4kw9nXqpNDz3tdSsqEYUgeHD/NuF" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- SHARED SUPABASE CONFIG -->
    <script src="../js/supabase.js"></script>
    <script src="../js/utils.js"></script>

    <!-- FORGOT PASSWORD LOGIC -->
    <script>
        const forgotForm = document.getElementById("forgotForm");
        const forgotMessage = document.getElementById("forgotMessage");
        const forgotButton = document.querySelector(".login-submit");

        forgotForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("forgotEmail").value.trim();

            forgotButton.disabled = true;
            forgotButton.textContent = "Sending…";

            // resetPasswordForEmail needs `redirectTo` to be listed in
            // the Supabase dashboard under Authentication → URL
            // Configuration → Redirect URLs, otherwise it is ignored.
            const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: new URL("reset-password.html", window.location.href).href
            });

            if (error) {
                setFormMessage(forgotMessage, getErrorMessage(error), true);
                forgotButton.disabled = false;
                forgotButton.textContent = "Send recovery link →";
                return;
            }

            // Deliberately vague: confirming which addresses exist would
            // turn this form into an account-enumeration oracle.
            setFormMessage(
                forgotMessage,
                "If that address has a LinkUp account, a recovery link is on its way. " +
                "Check your spam folder if it hasn't arrived in a few minutes.",
                false
            );
            forgotButton.disabled = false;
            forgotButton.textContent = "Send another link →";
        });
    </script>

</body>
</html>
